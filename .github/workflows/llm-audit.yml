name: llm-audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Pinned to SHA per https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
      # Update with: gh api repos/<owner>/<repo>/releases/latest --jq .target_commitish
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The llm-audit action runs the CLI from this pinned commit and installs
      # Semgrep. No `npm ci`: a static scan never needs this app's dependency
      # tree, and installing it would fail the job for non-security reasons.
      - uses: Javierlozo/llm-audit@28bc3190b565e64f312ca38a254df29112beeaf3  # v0.11.0
